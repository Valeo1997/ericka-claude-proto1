<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ericka - Your AI Dispatcher</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <elevenlabs-convai agent-id="agent_8101kj63b1p5e11vsbmev3n71mqh"></elevenlabs-convai>
    <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
    <script>
      // Fix ElevenLabs widget styling for user messages
      setInterval(() => {
        const widget = document.querySelector('elevenlabs-convai');
        if (widget && widget.shadowRoot) {
          const elements = widget.shadowRoot.querySelectorAll('*');
          elements.forEach(el => {
            const bg = window.getComputedStyle(el).backgroundColor;
            // If the element has a white background (user message bubble)
            if (bg === 'rgb(255, 255, 255)' || bg === 'rgba(255, 255, 255, 1)') {
              el.style.setProperty('color', '#050b14', 'important');
              // Force all children inside the white bubble to also be dark
              const children = el.querySelectorAll('*');
              children.forEach(child => {
                child.style.setProperty('color', '#050b14', 'important');
              });
            }
          });
        }
      }, 500);
    </script>
  </body>
</html>
